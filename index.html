<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="SpiritTech - техника для игр, работы и повседневной жизни."
  >

  <title>SpiritTech - магазин техники</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/favicon.jpg" type="image/jpeg">

  <script src="js/data.js" defer></script>
  <script src="js/script.js" defer></script>
</head>

<body>
  <header class="header">
    <div class="container header-content">
      <a class="logo" href="./index.html">
        Spirit<span>Tech</span>
      </a>

      <nav class="navigation" aria-label="Основная навигация">
        <a href="#catalog">Каталог</a>
        <a href="#contacts">Контакты</a>
      </nav>

      <button class="cart-button" type="button">
        Корзина
        <span class="cart-count">0</span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <h1 id="hero-title">
          Техника для ярких <span>побед</span>
        </h1>

        <p>Для игр, работы и повседневной жизни.</p>

        <a class="primary-button" href="#catalog">
          Смотреть каталог
        </a>
      </div>
    </section>

    <section class="catalog" id="catalog" aria-labelledby="catalog-title">
      <h2 id="catalog-title">Каталог</h2>

      <div class="product-list"></div>
    </section>
  </main>

  <dialog class="cart-panel" id="cart-dialog" aria-labelledby="cart-title">
  <div class="cart-header">
    <h2 id="cart-title">Ваша корзина</h2>

    <button class="cart-close" type="button" aria-label="Закрыть корзину">
      ×
    </button>
  </div>

  <div class="cart-items">
    <p class="cart-empty">Корзина пока пуста</p>
  </div>

  <div class="cart-footer">
    <p class="cart-summary">
      Итого:
      <strong class="cart-total">0 ₽</strong>
    </p>

    <button class="primary-button checkout-button" type="button" disabled>
      Оформить заказ
    </button>
  </div>
</dialog>
  
  <footer class="footer" id="contacts">
    <div class="container">
      <p>SpiritTech</p>
    </div>
  </footer>
</body>
</html>
